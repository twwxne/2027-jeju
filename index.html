<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>濟州島 2027 · 旅遊手冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --basalt: #17140F;
    --basalt-2: #211D16;
    --basalt-soft: #2B261D;
    --cream: #F6EFE2;
    --cream-2: #ECE1CB;
    --tangerine: #E8772E;
    --tangerine-dark: #C9591E;
    --canola: #93A93B;
    --teal: #2C6E6A;
    --coral: #C15C4E;
    --ink: #2A2620;
    --ink-soft: #6b6152;
    --line: rgba(246,239,226,0.16);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:var(--basalt);
    color:var(--cream);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .display{font-family:'Fraunces', serif;}
  .mono{font-family:'Space Mono', monospace;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 6rem 1.5rem 4rem;
    background:
      radial-gradient(ellipse 90% 60% at 50% 0%, rgba(232,119,46,0.16), transparent 60%),
      radial-gradient(ellipse 70% 50% at 85% 90%, rgba(44,110,106,0.20), transparent 60%),
      linear-gradient(180deg, var(--basalt) 0%, var(--basalt-2) 100%);
    overflow:hidden;
  }

  .hero::before{
    content:'';
    position:absolute; inset:0;
    background-image:
      radial-gradient(rgba(246,239,226,0.5) 1px, transparent 1px);
    background-size: 46px 46px;
    opacity:0.06;
    pointer-events:none;
  }

  .eyebrow{
    font-family:'Space Mono', monospace;
    letter-spacing:0.35em;
    text-transform:uppercase;
    font-size:0.72rem;
    color:var(--tangerine);
    margin-bottom:1.1rem;
    z-index:2;
    opacity:0;
    animation: fadeUp 0.8s ease forwards 0.1s;
  }

  h1.title{
    font-size: clamp(2.8rem, 9vw, 6rem);
    font-weight:600;
    margin:0 0 0.3rem;
    text-align:center;
    letter-spacing:-0.01em;
    line-height:1.02;
    z-index:2;
    opacity:0;
    animation: fadeUp 0.9s ease forwards 0.25s;
  }
  h1.title em{
    font-style:italic;
    font-weight:500;
    color:var(--tangerine);
  }

  .subtitle{
    font-size:1rem;
    color:var(--cream-2);
    opacity:0;
    letter-spacing:0.06em;
    margin-bottom:3rem;
    text-align:center;
    animation: fadeUp 0.9s ease forwards 0.4s;
  }
  .subtitle b{color:var(--teal); font-weight:600;}

  /* ---------- BOARDING PASS ---------- */
  .hero-body{
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 2.8rem;
    flex-wrap:wrap;
    width:100%;
  }

  .pass-wrap{
    opacity:0;
    animation: fadeUp 1s ease forwards 0.55s;
    perspective: 1200px;
  }

  .hero-side{
    display:flex;
    flex-direction:column;
    gap:1.1rem;
    width: min(280px, 92vw);
    opacity:0;
    animation: fadeUp 1s ease forwards 0.7s;
  }

  .hero-side .planner-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:0.6rem;
  }
  .hero-side .plan-tab{
    min-height:auto;
    padding: 0.85rem 0.8rem;
    border-radius:12px;
    gap:0.2rem;
  }
  .hero-side .plan-tab h3{
    font-size:0.86rem;
    margin: 0.35rem 0 0;
  }

  @media (max-width: 760px){
    .hero-side{ width:min(420px, 92vw); }
  }

  .pass{
    position:relative;
    display:flex;
    background:var(--cream);
    color:var(--ink);
    border-radius:18px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55), 0 10px 20px -10px rgba(0,0,0,0.4);
    max-width: 720px;
    width: min(88vw, 720px);
    transform: rotate(-1.2deg);
    transition: transform 0.4s ease;
  }
  .pass:hover{ transform: rotate(0deg) translateY(-4px); }

  .pass-main{
    flex: 1 1 66%;
    padding: 1.8rem 1.6rem 1.6rem;
    position:relative;
  }
  .pass-stub{
    flex: 1 1 34%;
    padding: 1.8rem 1.4rem;
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    background: var(--cream-2);
    border-radius: 0 18px 18px 0;
  }

  .pass-divider{
    position:relative;
    width:0;
    border-left: 2px dashed rgba(42,38,32,0.28);
  }
  .pass-divider::before, .pass-divider::after{
    content:'';
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:26px; height:26px;
    background: var(--basalt);
    border-radius:50%;
  }
  .pass-divider::before{ top:-13px; }
  .pass-divider::after{ bottom:-13px; }

  .route-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:1.4rem;
  }
  .code-block{ text-align:center; }
  .code-block .code{ font-size:1.9rem; font-weight:700; letter-spacing:0.02em; }
  .code-block .city{ font-size:0.62rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-soft); margin-top:2px;}

  .route-line{
    flex:1;
    margin: 0 0.9rem;
    height:1px;
    background: repeating-linear-gradient(90deg, var(--ink-soft) 0 6px, transparent 6px 11px);
    position:relative;
    top:-10px;
  }
  .route-line svg{
    position:absolute; top:-9px; left:50%;
    transform: translateX(-50%);
    width:22px; height:22px;
    color: var(--tangerine-dark);
  }

  .field-row{ display:flex; gap:1.6rem; margin-bottom:1.1rem; flex-wrap:wrap;}
  .field .label{ font-size:0.6rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:3px;}
  .field .value{ font-family:'Space Mono', monospace; font-size:1rem; font-weight:700; }
  .field .value.big{ font-size:1.2rem; }

  .barcode{
    display:flex; align-items:flex-end; gap:2px; height:34px; margin-top:1.3rem;
  }
  .barcode span{ display:block; width:3px; background:var(--ink); opacity:0.85;}

  .stub-label{ font-size:0.62rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft);}
  .stub-code{ font-family:'Space Mono', monospace; font-weight:700; font-size:1.5rem; margin-top:2px;}
  .stub-note{ font-size:0.78rem; color:var(--ink-soft); line-height:1.5; margin-top:1rem;}

  .countdown-tag{
    position:absolute;
    top:-16px; right: 18px;
    z-index:5;
    background: var(--tangerine);
    color:var(--cream);
    padding:0.45rem 0.9rem;
    border-radius:999px;
    font-family:'Space Mono', monospace;
    font-size:0.75rem;
    font-weight:700;
    box-shadow: 0 8px 18px -6px rgba(232,119,46,0.6);
    white-space:nowrap;
  }

  .scroll-hint{
    z-index:2;
    margin-top:3.2rem;
    display:flex; flex-direction:column; align-items:center; gap:0.5rem;
    color: var(--cream-2);
    opacity:0.55;
    font-size:0.7rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    animation: fadeUp 1s ease forwards 0.9s, bob 2.4s ease-in-out 1.9s infinite;
  }
  .scroll-hint{opacity:0;}

  @keyframes fadeUp{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(6px);} }

  /* ---------- ABOUT / ISLAND SNAPSHOT ---------- */
  .section{ padding: 6rem 1.5rem; max-width:1080px; margin:0 auto; }
  .section-head{ margin-bottom:2.6rem; }
  .section-head .tag{
    font-family:'Space Mono', monospace; font-size:0.7rem; letter-spacing:0.3em;
    text-transform:uppercase; color:var(--teal); margin-bottom:0.8rem; display:block;
  }
  .section-head h2{
    font-family:'Fraunces', serif; font-weight:600; font-size:clamp(1.8rem,4vw,2.6rem);
    margin:0; color:var(--cream);
  }

  /* ---------- PLANNER GRID (index of future sections) ---------- */
  .planner-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:1.1rem;
  }
  @media (max-width: 900px){ .planner-grid{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px){ .planner-grid{ grid-template-columns: 1fr; } }

  .plan-tab{
    position:relative;
    border:1.5px dashed rgba(246,239,226,0.22);
    border-radius:16px;
    padding:1.5rem 1.3rem 1.4rem;
    min-height:150px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:space-between;
    background: transparent;
    text-align:left;
    cursor:pointer;
    font-family:'Noto Sans TC', sans-serif;
    transition: border-color 0.25s ease, background 0.25s ease, transform 0.25s ease;
  }
  .plan-tab:hover{
    border-color: rgba(232,119,46,0.55);
    background: rgba(246,239,226,0.03);
    transform: translateY(-3px);
  }
  .plan-tab:focus-visible{
    outline: 2px solid var(--tangerine);
    outline-offset:3px;
  }
  .plan-tab.active{
    border-style: solid;
    border-color: var(--tangerine);
    background: rgba(232,119,46,0.08);
  }
  .plan-tab .num{
    font-family:'Space Mono', monospace;
    font-size:0.7rem;
    color: rgba(246,239,226,0.35);
    letter-spacing:0.1em;
  }
  .plan-tab.active .num{ color: var(--tangerine); }
  .plan-tab h3{
    font-family:'Fraunces', serif;
    font-size:1.1rem;
    font-weight:600;
    margin: 0.55rem 0 0.25rem;
    color: var(--cream);
  }
  .plan-tab p{
    margin:0;
    font-size:0.8rem;
    color: rgba(246,239,226,0.45);
    line-height:1.5;
  }

  /* ---------- PLANNER PANEL (content swapped by tab) ---------- */
  .planner-panel{
    margin-top:1.6rem;
    border:1px solid var(--line);
    border-radius:20px;
    padding: 2.4rem 2.2rem;
    min-height: 220px;
    background: linear-gradient(180deg, rgba(246,239,226,0.03), transparent);
    display:flex;
    flex-direction:column;
    gap:0.9rem;
    opacity:0;
    animation: fadeUp 0.5s ease forwards;
  }
  .planner-panel .panel-eyebrow{
    display:flex; align-items:center; gap:0.6rem;
    font-family:'Space Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color: var(--tangerine);
  }
  .planner-panel .panel-eyebrow .dot{
    width:6px; height:6px; border-radius:50%; background:var(--tangerine);
  }
  .planner-panel h3{
    font-family:'Fraunces', serif;
    font-size:1.7rem;
    font-weight:600;
    margin:0;
    color:var(--cream);
  }
  .planner-panel .panel-status{
    align-self:flex-start;
    font-family:'Space Mono', monospace;
    font-size:0.68rem;
    letter-spacing:0.08em;
    padding: 0.3rem 0.7rem;
    border-radius:999px;
    background: rgba(246,239,226,0.06);
    color: rgba(246,239,226,0.55);
  }
  .planner-panel .panel-note{
    margin:0;
    font-size:0.92rem;
    line-height:1.7;
    color: rgba(246,239,226,0.55);
    max-width: 46ch;
  }

  /* ---------- CHECKLIST (行前備註) ---------- */
  .person-block{
    display:flex;
    flex-direction:column;
    gap:0.7rem;
    width:100%;
  }
  .person-block-head{
    display:flex;
    align-items:center;
    gap:0.6rem;
  }
  .person-block-head h4{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.05rem;
    margin:0;
    color:var(--cream);
    flex:1;
  }
  .legend-dot{
    width:10px; height:10px;
    border-radius:50%;
    flex:none;
  }
  .legend-dot.person-a{ background: var(--tangerine); }
  .legend-dot.person-b{ background: var(--teal); }

  .person-divider{
    height:1px;
    background: var(--line);
    margin: 0.4rem 0 0.2rem;
  }

  .progress-track{
    width:100%;
    height:8px;
    border-radius:999px;
    background: rgba(246,239,226,0.1);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    border-radius:999px;
    transition: width 0.35s ease;
  }
  .progress-fill.person-a{ background: linear-gradient(90deg, var(--canola), var(--tangerine)); }
  .progress-fill.person-b{ background: linear-gradient(90deg, var(--teal), #5FBFB9); }
  .progress-text{
    font-size:0.75rem;
    color: rgba(246,239,226,0.6);
    white-space:nowrap;
  }

  .checklist{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.6rem 2.4rem;
    width:100%;
    margin-top:0.4rem;
  }
  @media (max-width: 700px){
    .checklist{ grid-template-columns: 1fr; }
  }

  .check-group-title{
    font-size:0.68rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--teal);
    margin-bottom:0.7rem;
  }
  .check-rows{
    display:flex;
    flex-direction:column;
    gap:0.55rem;
  }

  .check-row{
    display:flex;
    align-items:center;
    gap:0.7rem;
    cursor:pointer;
    user-select:none;
  }
  .check-row input[type="checkbox"]{
    position:absolute;
    opacity:0;
    width:0; height:0;
  }
  .check-box{
    flex:none;
    width:20px; height:20px;
    border-radius:6px;
    border:1.5px solid rgba(246,239,226,0.3);
    display:flex; align-items:center; justify-content:center;
    color: var(--basalt);
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .check-box svg{
    width:13px; height:13px;
    opacity:0;
    transform: scale(0.6);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .check-row input:checked + .check-box.person-a{
    background: var(--tangerine);
    border-color: var(--tangerine);
  }
  .check-row input:checked + .check-box.person-b{
    background: var(--teal);
    border-color: var(--teal);
  }
  .check-row input:checked + .check-box svg{
    opacity:1;
    transform: scale(1);
  }
  .check-row input:focus-visible + .check-box{
    outline: 2px solid var(--tangerine);
    outline-offset:2px;
  }
  .check-label{
    font-size:0.88rem;
    color: rgba(246,239,226,0.8);
    line-height:1.4;
    transition: color 0.2s ease, opacity 0.2s ease;
  }
  .check-row input:checked ~ .check-label{
    color: rgba(246,239,226,0.4);
    text-decoration: line-through;
  }

  .reset-btn{
    align-self:flex-start;
    margin-top:0.6rem;
    background:none;
    border:1px solid rgba(246,239,226,0.25);
    color: rgba(246,239,226,0.55);
    padding:0.45rem 1rem;
    border-radius:999px;
    font-size:0.7rem;
    letter-spacing:0.06em;
    cursor:pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .reset-btn:hover{
    border-color: var(--coral);
    color: var(--coral);
  }

  /* ---------- FOOD MAP (美食地圖) ---------- */
  .region-tabs{
    display:flex;
    gap:0.6rem;
    flex-wrap:wrap;
  }
  .region-tab{
    padding:0.5rem 1.15rem;
    border-radius:999px;
    border:1.5px solid rgba(246,239,226,0.22);
    background:transparent;
    color: rgba(246,239,226,0.62);
    font-family:'Noto Sans TC', sans-serif;
    font-size:0.85rem;
    cursor:pointer;
    transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
  }
  .region-tab:hover{
    border-color: rgba(232,119,46,0.5);
  }
  .region-tab.active{
    border-color: var(--tangerine);
    background: rgba(232,119,46,0.12);
    color: var(--cream);
  }

  .food-list{
    display:flex;
    flex-direction:column;
    gap:1rem;
    width:100%;
    margin-top:0.4rem;
  }

  .food-card{
    border:1px solid var(--line);
    border-radius:14px;
    padding:1.1rem 1.3rem;
    display:flex;
    flex-direction:row;
    align-items:flex-start;
    gap:1.1rem;
  }
  .food-card-content{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:0.35rem;
  }
  .map-link{
    display:inline-block;
    align-self:flex-start;
    margin-top:0.3rem;
    font-size:0.7rem;
    letter-spacing:0.08em;
    color: var(--tangerine);
    padding:0.3rem 0.9rem;
    border:1px solid rgba(232,119,46,0.45);
    border-radius:999px;
    text-decoration:none;
    transition: background 0.2s ease;
  }
  .map-link:hover{
    background: rgba(232,119,46,0.15);
  }
  .food-image{
    flex:none;
    width:132px;
    height:132px;
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .food-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    cursor: zoom-in;
    transition: filter 0.2s ease;
  }
  .food-image img:hover{
    filter: brightness(1.08);
  }
  @media (max-width: 560px){
    .food-card{ flex-direction:column; }
    .food-image{ width:100%; height:180px; }
  }
  .food-card .name{
    font-size:1.1rem;
    font-weight:600;
    color:var(--cream);
  }
  .food-cost{
    font-size:0.78rem;
    color: rgba(246,239,226,0.6);
  }
  .food-name-kr{
    font-size:0.82rem;
    font-weight:400;
    font-style:italic;
    color: rgba(246,239,226,0.5);
  }
  .food-address{
    display:flex;
    align-items:flex-start;
    font-size:0.82rem;
    color: rgba(246,239,226,0.6);
    line-height:1.5;
  }
  .food-address-label{
    flex:none;
    font-size:0.68rem;
    letter-spacing:0.06em;
    color: var(--tangerine);
    margin-right:0.5rem;
  }
  .food-address-lines{
    display:flex;
    flex-direction:column;
    gap:0.15rem;
  }
  .food-card .meta{
    font-size:0.7rem;
    letter-spacing:0.06em;
    color: var(--tangerine);
  }
  .food-card .note{
    font-size:0.85rem;
    color: rgba(246,239,226,0.6);
    line-height:1.5;
  }

  .food-hours{
    margin-top:0.3rem;
  }
  .food-hours summary{
    cursor:pointer;
    list-style:none;
    font-family:'Space Mono', monospace;
    font-size:0.75rem;
    letter-spacing:0.08em;
    color: var(--teal);
    padding:0.35rem 0;
    display:flex;
    align-items:center;
    gap:0.4rem;
  }
  .food-hours summary::-webkit-details-marker{ display:none; }
  .food-hours summary::before{
    content:'▸';
    font-size:0.7rem;
    transition: transform 0.2s ease;
  }
  .food-hours[open] summary::before{
    transform: rotate(90deg);
  }
  .hours-table{
    display:flex;
    flex-direction:column;
    gap:0.5rem;
    padding: 0.6rem 0 0.2rem;
    border-top:1px solid var(--line);
    margin-top:0.2rem;
  }
  .hours-row{
    display:flex;
    gap:1rem;
    align-items:baseline;
  }
  .hours-day{
    flex:none;
    width:74px;
    font-size:0.72rem;
    color: rgba(246,239,226,0.55);
  }
  .hours-detail{
    font-size:0.82rem;
    color: rgba(246,239,226,0.8);
    line-height:1.6;
  }
  .hours-label{
    font-size:0.68rem;
    letter-spacing:0.04em;
    color: var(--tangerine);
    margin-right:0.2rem;
  }
  .food-links{
    display:flex;
    gap:0.5rem;
    flex-wrap:wrap;
  }
  .remark-content{
    padding: 0.6rem 0 0.2rem;
    border-top:1px solid var(--line);
    margin-top:0.2rem;
    font-size:0.85rem;
    color: rgba(246,239,226,0.7);
    line-height:1.6;
  }

  .food-empty{
    border:1.5px dashed rgba(246,239,226,0.22);
    border-radius:14px;
    padding:2.2rem 1.5rem;
    text-align:center;

<script>
  // ---- Weekday labels (computed, not hardcoded) ----
  function fmt(y,m,d){
    const dt = new Date(Date.UTC(y, m-1, d));
    const wd = ['日','一','二','三','四','五','六'][dt.getUTCDay()];
    return { text: `${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')} (${wd})` };
  }
  document.getElementById('dateStart').textContent = fmt(2027,3,22).text;
  document.getElementById('dateEnd').textContent = fmt(2027,3,27).text;

  // ---- Barcode ----
  const barcode = document.getElementById('barcode');
  let bars = '';
  for (let i=0;i<48;i++){
    const w = [2,3,4][Math.floor(Math.random()*3)];
    const h = 14 + Math.floor(Math.random()*20);
    bars += `<span style="width:${w}px;height:${h}px;"></span>`;
  }
  barcode.innerHTML = bars;

  // ---- Storage helper (works in Claude preview via window.storage, falls back to localStorage for the saved file) ----
  const STORAGE_KEY = 'jeju-pretrip-checklist';
  async function loadChecklistState(){
    try {
      if (window.storage) {
        const res = await window.storage.get(STORAGE_KEY);
        return res ? JSON.parse(res.value) : {};
      }
    } catch(e){ /* key not found yet, fall through */ }
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch(e){ return {}; }
  }
  async function saveChecklistState(stateObj){
    const json = JSON.stringify(stateObj);
    try {
      if (window.storage) { await window.storage.set(STORAGE_KEY, json); return; }
    } catch(e){ /* fall through to localStorage */ }
    try { localStorage.setItem(STORAGE_KEY, json); } catch(e){ /* no persistence available */ }
  }

  const checklistGroupsWone = [
    { category: '證件與財物', items: [
        { id:'passport', label:'護照（效期6個月以上）' },
        { id:'ticket', label:'機票 / 登機證' },
        { id:'hotelconf', label:'訂房確認信' },
        { id:'insurance', label:'旅遊保險' },
        { id:'card', label:'信用卡' },
        { id:'cash', label:'韓元現金' },
    ]},
    { category:'3C 與電源', items:[
        { id:'phone', label:'手機' },
        { id:'powerbank', label:'行動電源' },
        { id:'adapter', label:'轉接頭 / 充電線' },
        { id:'camera', label:'相機 / 記憶卡' },
        { id:'earphone', label:'耳機' },
    ]},
    { category:'穿搭與禦寒（早春）', items:[
        { id:'jacket', label:'防風外套' },
        { id:'scarf', label:'圍巾 / 薄手套' },
        { id:'hat', label:'帽子' },
        { id:'umbrella', label:'雨傘 / 雨衣' },
        { id:'shoes', label:'好走的鞋' },
    ]},
    { category:'個人清潔與藥品', items:[
        { id:'lip', label:'護唇膏 / 保濕用品' },
        { id:'meds', label:'常備藥（腸胃藥、感冒藥）' },
        { id:'lens', label:'隱形眼鏡 / 眼鏡' },
        { id:'toiletries', label:'牙刷牙膏等盥洗用品' },
    ]},
    { category:'出發當天再次確認', items:[
        { id:'home', label:'家中門窗、瓦斯確認' },
        { id:'luggage', label:'行李秤重' },
        { id:'docsrecheck', label:'證件再次清點' },
    ]},
  ];

  const checklistGroupsHsiao = [
    { category: '證件與財物', items: [
        { id:'passport', label:'護照（效期6個月以上）' },
        { id:'ticket', label:'機票 / 登機證' },
        { id:'hotelconf', label:'訂房確認信' },
        { id:'insurance', label:'旅遊保險' },
        { id:'card', label:'信用卡' },
        { id:'cash', label:'韓元現金' },
    ]},
    { category:'3C 與電源', items:[
        { id:'phone', label:'手機' },
        { id:'powerbank', label:'行動電源' },
        { id:'adapter', label:'轉接頭 / 充電線' },
        { id:'camera', label:'相機 / 記憶卡' },
        { id:'earphone', label:'耳機' },
    ]},
    { category:'穿搭與禦寒（早春）', items:[
        { id:'jacket', label:'防風外套' },
        { id:'scarf', label:'圍巾 / 薄手套' },
        { id:'hat', label:'帽子' },
        { id:'umbrella', label:'雨傘 / 雨衣' },
        { id:'shoes', label:'好走的鞋' },
    ]},
    { category:'個人清潔與藥品', items:[
        { id:'lip', label:'護唇膏 / 保濕用品' },
        { id:'meds', label:'常備藥（腸胃藥、感冒藥）' },
        { id:'lens', label:'隱形眼鏡 / 眼鏡' },
        { id:'toiletries', label:'牙刷牙膏等盥洗用品' },
    ]},
    { category:'出發當天再次確認', items:[
        { id:'home', label:'家中門窗、瓦斯確認' },
        { id:'luggage', label:'行李秤重' },
        { id:'docsrecheck', label:'證件再次清點' },
    ]},
  ];

  // ---- Planner tabs ----
  const panelData = {
    itinerary: {
      title: '每日行程',
      note: '這裡之後會放 Day 1 – Day 6 每天的移動路線與安排，跟我說要排哪一天，我就填進來。'
    },
    spots: {
      title: '美食地圖',
      note: '餐廳、咖啡廳與必吃清單會列在這裡，可以隨時請我加入或刪除店家。'
    },
    food: {
      title: '住宿資訊',
      note: '飯店 / 民宿的地址、訂房編號與注意事項會放在這裡。'
    },
    transport: {
      title: '交通與租車',
      note: '機場往返方式、租車資訊與市區移動方式會整理在這裡。'
    },
    stay: {
      title: '行前備註',
      note: '出發前要準備的事項、備忘與提醒會整理在這裡。'
    },
    packing: {
      title: '記帳本',
      note: '旅程中的花費與預算記錄會放在這裡，方便隨時記帳與核對。'
    }
  };

  const tabs = document.querySelectorAll('.plan-tab');
  const panel = document.getElementById('plannerPanel');

  const PEOPLE = [
    { key: 'wone', name: 'Wone', cls: 'person-a', groups: checklistGroupsWone },
    { key: 'hsiao', name: 'Hsiao', cls: 'person-b', groups: checklistGroupsHsiao },
  ];

  function normalizeState(raw){
    return {
      wone: (raw && typeof raw.wone === 'object') ? raw.wone : {},
      hsiao: (raw && typeof raw.hsiao === 'object') ? raw.hsiao : {},
    };
  }

  function personProgress(person, personState){
    const total = person.groups.reduce((n,g) => n + g.items.length, 0);
    const checked = person.groups.reduce((n,g) => n + g.items.filter(it => personState[it.id]).length, 0);
    return { total, checked, pct: total ? Math.round((checked/total) * 100) : 0 };
  }

  function renderPersonSection(person, personState){
    const { total, checked, pct } = personProgress(person, personState);

    const groupsHTML = person.groups.map(group => `
      <div class="check-group">
        <div class="check-group-title mono">${group.category}</div>
        <div class="check-rows">
          ${group.items.map(item => `
            <label class="check-row" for="chk-${person.key}-${item.id}">
              <input type="checkbox" id="chk-${person.key}-${item.id}" data-person="${person.key}" data-id="${item.id}" ${personState[item.id] ? 'checked' : ''}>
              <span class="check-box ${person.cls}" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <span class="check-label">${item.label}</span>
            </label>
          `).join('')}
        </div>
      </div>
    `).join('');

    return `
      <div class="person-block">
        <div class="person-block-head">
          <span class="legend-dot ${person.cls}"></span>
          <h4 class="display">${person.name} 的清單</h4>
          <span class="progress-text mono" data-count="${person.key}">${checked} / ${total}</span>
        </div>
        <div class="progress-track"><div class="progress-fill ${person.cls}" data-fill="${person.key}" style="width:${pct}%"></div></div>
        <div class="checklist">${groupsHTML}</div>
      </div>
    `;
  }

  function renderChecklistHTML(rawState){
    const state = normalizeState(rawState);
    return `
      <span class="panel-eyebrow"><span class="dot"></span>Now Viewing</span>
      <h3 class="display">行前備註</h3>

      ${renderPersonSection(PEOPLE[0], state[PEOPLE[0].key])}
      <div class="person-divider"></div>
      ${renderPersonSection(PEOPLE[1], state[PEOPLE[1].key])}

      <button class="reset-btn mono" id="resetChecklist" type="button">全部清除</button>
    `;
  }

  async function renderChecklist(){
    const raw = await loadChecklistState();
    panel.innerHTML = renderChecklistHTML(raw);

    panel.querySelectorAll('input[type="checkbox"]').forEach(input => {
      input.addEventListener('change', async () => {
        const current = normalizeState(await loadChecklistState());
        current[input.dataset.person][input.dataset.id] = input.checked;
        await saveChecklistState(current);

        const person = PEOPLE.find(p => p.key === input.dataset.person);
        const { total, checked, pct } = personProgress(person, current[person.key]);
        const fillEl = panel.querySelector(`[data-fill="${person.key}"]`);
        const textEl = panel.querySelector(`[data-count="${person.key}"]`);
        if (fillEl) fillEl.style.width = pct + '%';
        if (textEl) textEl.textContent = `${checked} / ${total}`;
      });
    });

    panel.querySelector('#resetChecklist').addEventListener('click', async () => {
      await saveChecklistState({});
      renderChecklist();
    });
  }

  function renderFoodCard(item){
    const addressList = item.address ? (Array.isArray(item.address) ? item.address : [item.address]) : [];
    const addressBlock = addressList.length ? `
      <div class="food-address">
        <span class="food-address-label mono">地址</span>
        <span class="food-address-lines">${addressList.map(a => `<span class="food-address-line">${a}</span>`).join('')}</span>
      </div>
    ` : '';
    const costBlock = item.avgCost ? `<div class="food-cost mono"><span class="food-address-label mono">人均</span>${item.avgCost}</div>` : '';
    let hoursBlock = '';
    if (item.hours && item.hours.length){
      hoursBlock = `
        <details class="food-hours">
          <summary>營業時間</summary>
          <div class="hours-table">
            ${item.hours.map(h => `
              <div class="hours-row">
                <span class="hours-day mono">${h.day}</span>
                <span class="hours-detail">
                  ${h.lines.map(l => `<span class="hours-label">${l.label}</span> ${l.value}`).join('<br>')}
                </span>
              </div>
            `).join('')}
          </div>
        </details>
      `;
    }
    const mapLinksArr = item.mapLinks ? item.mapLinks : (item.mapUrl ? [{ label:'地圖', url:item.mapUrl }] : []);
    const mapLinksHtml = mapLinksArr.map(m => `<a class="map-link mono" href="${m.url}" target="_blank" rel="noopener">${m.label}</a>`).join('');
    const waitlistLink = item.catchtableUrl ? `<a class="map-link mono" href="${item.catchtableUrl}" target="_blank" rel="noopener">候位</a>` : '';
    const linksRow = (mapLinksHtml || waitlistLink) ? `<div class="food-links">${mapLinksHtml}${waitlistLink}</div>` : '';
    const imageBlock = item.image ? `<div class="food-image"><img src="${item.image}" alt="${item.name || ''}" loading="lazy"></div>` : '';
    return `
      <div class="food-card">
        <div class="food-card-content">
          <div class="name display">${item.name || ''}${item.nameKr ? ` <span class="food-name-kr">${item.nameKr}</span>` : ''}</div>
          ${addressBlock}
          ${costBlock}
          ${item.type ? `<div class="meta mono">${item.type}</div>` : ''}
          ${item.note ? `<details class="food-hours"><summary>備註</summary><div class="remark-content">${item.note}</div></details>` : ''}
          ${hoursBlock}
          ${linksRow}
        </div>
        ${imageBlock}
      </div>
    `;
  }

      `;

    panel.innerHTML = `

      <h3 class="display">美食地圖</h3>
      <div class="region-tabs" id="regionTabs">

          <button class="region-tab ${key === activeFoodRegion ? 'active' : ''}" data-region="${key}">${data.label}</button>
        `).join('')}
      </div>
      <div class="food-list">${listHTML}</div>
    `;

    panel.querySelectorAll('.region-tab').forEach(btn => {

      const dateLabel = fmt(item.y, item.m, item.d).text;
      return `
        <div class="transport-card">
          <div class="transport-icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 16v-2l-8.5-5V3.5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5V9L2 14v2l8.5-2.5V19L8 20.5V22l4-1 4 1v-1.5L13.5 19v-5.5L22 16z"/></svg>
          </div>
          <div class="transport-body">
            <div class="transport-top">
              <span class="transport-route display">台灣虎航　${item.from} → ${item.to}</span>
              <span class="transport-top-right">
                <span class="transport-code mono">${item.code}</span>
                <a class="transport-link mono" href="https://www.tigerairtw.com/zh-TW" target="_blank" rel="noopener">官網</a>
              </span>
            </div>
            <div class="transport-time mono">${item.timeStart} – ${item.timeEnd}</div>
            <div class="transport-date mono">${dateLabel}</div>
          </div>
        </div>
      `;
    }
    return '';
  }

  function renderTransport(){
    const listHTML = transportData.length
      ? transportData.map(renderTransportCard).join('')
      : `
        <div class="transport-empty">
          <p>尚未加入交通資訊</p>
          <p class="hint">跟我說想加入哪些航班、租車或巴士資訊</p>
        </div>
      `;

    panel.innerHTML = `
      <span class="panel-eyebrow"><span class="dot"></span>Now Viewing</span>
      <h3 class="display">交通與租車</h3>
      <div class="transport-list">${listHTML}</div>
    `;
  }

  // ---- Ledger (記帳本) — backed by Google Sheet via Apps Script ----
  const LEDGER_API = 'https://script.google.com/macros/s/AKfycby-75g5s6Ri1M3YA9bOejwb1Ouf7tyNwfSaqWIzCBzHyFg20_c0-u3C5rTEIM3yJ3W8CQ/exec';

  async function fetchLedgerEntries(){
    const res = await fetch(LEDGER_API);
    if (!res.ok) throw new Error('fetch failed');
    return res.json();
  }

  async function postLedgerEntry(entry){
    const res = await fetch(LEDGER_API, {
      method: 'POST',
      body: JSON.stringify(entry),
    });
    if (!res.ok) throw new Error('post failed');
    return res.json();
  }

  async function deleteLedgerEntry(id){
    const res = await fetch(LEDGER_API, {
      method: 'POST',
      body: JSON.stringify({ action: 'delete', id }),
    });
    if (!res.ok) throw new Error('delete failed');
    return res.json();
  }

  function fmtLedgerDate(value){
    if (typeof value === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(value)) {
      return value.slice(0, 10);
    }
    return value || '';
  }

  function fmtLedgerNum(n){
    const num = Number(n);
    return isNaN(num) ? (n || '0') : num.toLocaleString('en-US');
  }

  async function renderLedger(){
    panel.innerHTML = `
      <span class="panel-eyebrow"><span class="dot"></span>Now Viewing</span>
      <h3 class="display">記帳本</h3>
      <div class="ledger-loading mono">載入 Google Sheet 資料中…</div>
    `;

    let entries = [];
    let loadError = false;
    try {
      entries = await fetchLedgerEntries();
    } catch (err) {
      loadError = true;
    }

    const totalsByCurrency = {};
    entries.forEach(e => {
      const cur = e['幣種'] || '—';
      const amt = Number(e['金額']) || 0;
      totalsByCurrency[cur] = (totalsByCurrency[cur] || 0) + amt;
    });

    const summaryHTML = Object.keys(totalsByCurrency).length
      ? Object.entries(totalsByCurrency).map(([cur, total]) => `
          <div class="ledger-total-chip mono">${cur} ${fmtLedgerNum(total)}</div>
        `).join('')
      : `<div class="ledger-total-chip mono">尚無記錄</div>`;

    const rowsHTML = entries.length
      ? [...entries].reverse().map(e => `
          <div class="ledger-row" data-id="${e['ID'] || ''}">
            <div class="ledger-row-main">
              <span class="ledger-date mono">${fmtLedgerDate(e['日期'])}</span>
              <span class="ledger-item">${e['項目'] || ''}</span>
              ${e['分類'] ? `<span class="ledger-category-tag mono">${e['分類']}</span>` : ''}
            </div>
            ${e['備註'] ? `<div class="ledger-note">${e['備註']}</div>` : ''}
            <span class="ledger-amount mono">${e['幣種'] || ''} ${fmtLedgerNum(e['金額'])}</span>
            ${e['ID'] ? `<button class="ledger-delete" data-id="${e['ID']}" aria-label="刪除">&times;</button>` : ''}
          </div>
        `).join('')
      : `<div class="ledger-empty">還沒有任何紀錄，新增第一筆花費看看</div>`;

    const today = new Date().toISOString().slice(0, 10);

    panel.innerHTML = `
      <span class="panel-eyebrow"><span class="dot"></span>Now Viewing</span>
      <h3 class="display">記帳本</h3>
      ${loadError ? `<div class="ledger-error mono">連線 Google Sheet 失敗，請確認網路連線後重新整理</div>` : ''}

      <div class="ledger-summary">${summaryHTML}</div>

      <form class="ledger-form" id="ledgerForm">
        <input type="date" class="ledger-input" id="ledgerDate" value="${today}" required>
        <input type="text" class="ledger-input" id="ledgerItem" placeholder="項目（例如：午餐）" required>
        <div class="ledger-amount-group">
          <input type="number" class="ledger-input" id="ledgerAmount" placeholder="金額" min="0" step="0.01" required>
          <select class="ledger-input ledger-select ledger-currency" id="ledgerCurrency">
            <option value="KRW">KRW</option>
            <option value="TWD">TWD</option>
            <option value="USD">USD</option>
          </select>
        </div>
        <select class="ledger-input ledger-select" id="ledgerCategory">
          <option value="飲食">飲食</option>
          <option value="交通">交通</option>
          <option value="住宿">住宿</option>
          <option value="購物">購物</option>
          <option value="娛樂">娛樂</option>
          <option value="其他">其他</option>
        </select>
        <input type="text" class="ledger-input" id="ledgerNote" placeholder="備註（選填）">
        <button type="submit" class="ledger-add-btn mono">新增</button>
        <div class="ledger-form-status mono" id="ledgerFormStatus"></div>
      </form>

      <div class="ledger-list">${rowsHTML}</div>
    `;

    document.getElementById('ledgerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('ledgerFormStatus');
      const entry = {
        date: document.getElementById('ledgerDate').value,
        item: document.getElementById('ledgerItem').value,
        amount: document.getElementById('ledgerAmount').value,
        currency: document.getElementById('ledgerCurrency').value,
        category: document.getElementById('ledgerCategory').value,
        note: document.getElementById('ledgerNote').value,
      };
      statusEl.textContent = '送出中…';
      try {
        await postLedgerEntry(entry);
        renderLedger();
      } catch (err) {
        statusEl.textContent = '送出失敗，請確認網路連線後再試一次';
      }
    });

    panel.querySelectorAll('.ledger-delete').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await deleteLedgerEntry(btn.dataset.id);
          renderLedger();
        } catch (err) {
          btn.disabled = false;
          alert('刪除失敗，請確認網路連線後再試一次');
        }
      });
    });
  }

  function renderNote(key){
    const data = panelData[key];
    panel.innerHTML = `
      <span class="panel-eyebrow"><span class="dot"></span>Now Viewing</span>
      <h3 class="display">${data.title}</h3>
      <span class="panel-status mono">尚未加入內容</span>
      <p class="panel-note">${data.note}</p>
    `;
  }

  function renderPanel(key){
    panel.style.animation = 'none';
    void panel.offsetWidth; // restart animation
    panel.style.animation = '';
    if (key === 'stay'){
      renderChecklist();
    } else if (key === 'spots'){
      renderFoodMap();
    } else if (key === 'transport'){
      renderTransport();
    } else if (key === 'packing'){
      renderLedger();
    } else {
      renderNote(key);
    }
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected','false'); });
      tab.classList.add('active');
      tab.setAttribute('aria-selected','true');
      renderPanel(tab.dataset.tab);
    });
  });

  renderPanel('itinerary');

  // ---- Countdown ----
  const target = new Date('2027-03-22T09:00:00+09:00').getTime();
  const tag = document.getElementById('countdownTag');
  function tick(){
    const now = Date.now();
    const diff = target - now;
    if (diff <= 0){
      tag.textContent = '旅程開始 · Bon Voyage';
      return;
    }
    const days = Math.ceil(diff / 86400000);
    tag.textContent = `D-${days}`;
  }
  tick();
  setInterval(tick, 3600000);

  // ---- Lightbox (click to enlarge food photos) ----
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');

  function openLightbox(src, alt){
    lightboxImg.src = src;
    lightboxImg.alt = alt || '';
    lightbox.classList.add('open');
  }
  function closeLightbox(){
    lightbox.classList.remove('open');
    lightboxImg.src = '';
  }

  document.addEventListener('click', (e) => {
    const img = e.target.closest('.food-image img');
    if (img){
      openLightbox(img.src, img.alt);
    }
  });
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });
</script>

</body>
</html>
